<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Ailis 涓変欢濂?路 涓変赴浠ｇ悊鍟嗗姟鍙?/title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* ===== 鑾叞杩壊绯?+ 寰俊寮忓乏鏍?===== */
  :root{
    --bg:#f4f6f9;          /* 涓昏儗鏅細娴呯背鐏?*/
    --card:#ffffff;
    --ink:#1f2a37;
    --muted:#6b7280;
    --line:#e6e9ef;
    --red:#c66b5f;         /* 涓変赴绾紙鑾叞杩檷楗卞拰锛?*/
    --red-soft:#f4e6e3;
    --teal:#7a9b8e;        /* 鑾叞杩豢 */
    --teal-soft:#e8efe9;
    --blue:#7c95b3;        /* 鑾叞杩摑 */
    --blue-soft:#e6ebf1;
    --amber:#b59870;       /* 鑾叞杩惀鐝€ */
    --green:#7a9b6b;       /* 鑾叞杩﹦姒勭豢 */
    --green-soft:#e8efe0;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ===== App Shell锛氬乏鏍?+ 涓诲尯 ===== */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:248px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .sidebar .brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .sidebar .logo{width:38px;height:38px;border-radius:11px;background:var(--red);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0}
  .sidebar .brand h1{font-size:15px;margin:0;font-weight:700;line-height:1.3;color:var(--ink)}
  .sidebar .brand .sub{font-size:11px;color:var(--muted);margin-top:1px}

  /* 寰俊寮忓鑸細绔栨潯閫変腑鎬?*/
  nav{flex:1;overflow-y:auto;padding:10px 8px}
  nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;color:var(--ink);
    font-size:14px;text-decoration:none;margin-bottom:4px;transition:.15s;cursor:pointer;
    position:relative}
  nav a:hover{background:#f3f4f6}
  /* 閫変腑鎬侊細缁胯壊绔栨潯 + 娴呯豢鑳屾櫙 */
  nav a.active{background:var(--green-soft);color:var(--green);font-weight:700}
  nav a.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
    width:4px;height:60%;background:var(--green);border-radius:0 3px 3px 0}
  nav a .icon{width:22px;text-align:center;font-size:17px;flex-shrink:0}
  nav a .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav a .badge{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--red);
    padding:2px 7px;border-radius:20px;line-height:1.3}

  .side-footer{margin-top:auto;padding:14px 16px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .side-footer b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}

  /* ===== 涓诲唴瀹瑰尯 ===== */
  .main{flex:1;overflow-y:auto;padding:24px 28px 40px}
  .wrap-inner{max-width:980px;margin:0 auto}

  .section{display:none;animation:fade .2s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 椤堕儴娆㈣繋鏉?*/
  .welcome{background:linear-gradient(120deg,#f3f6f1,#eaeee7);border:1px solid #d8e2cf;border-radius:14px;
    padding:18px 20px;margin-bottom:18px}
  .welcome h2{margin:0 0 6px;font-size:17px;color:#3e5e3a}
  .welcome p{margin:0;font-size:13px;color:#4b5563}

  /* 4 涓?mini 鎽樿鍗?*/
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .mini .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .mini .v{font-size:22px;font-weight:800;margin-top:4px}
  .mini .v small{font-size:12px;font-weight:600;color:var(--muted)}
  .mini.red .v{color:var(--red)}
  .mini.teal .v{color:var(--teal)}
  .mini.blue .v{color:var(--blue)}
  .mini.green .v{color:var(--green)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:#f1f5f0;
    padding:3px 9px;border-radius:20px}
  .card .update-info{font-size:12px;color:var(--muted);margin-bottom:14px;padding:8px 12px;background:#fafbf9;
    border-left:3px solid var(--green);border-radius:6px}

  /* 琛屼笟澧為噺锛圛NDUSTRIES锛?*/
  .theme{background:linear-gradient(180deg,#fff,#fcfdfe);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--red)}
  .theme h3{margin:0 0 7px;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .theme h3 .pill{font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:2px 9px;border-radius:20px}
  .theme p{margin:0;font-size:13px;color:#374151;line-height:1.65}
  .map{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12px;background:var(--teal-soft);color:var(--teal);border:1px solid #cddbd0;
    padding:3px 9px;border-radius:8px;font-weight:600}
  .src{font-size:11px;color:var(--muted);margin-top:8px}
  .src a{color:var(--teal);text-decoration:none;font-weight:600}
  .src a:hover{text-decoration:underline}

  /* 銆屾暟鎹椂鐐广€嶆爣绛撅細鍖哄埆浜庨〉闈㈡墦寮€鏃堕棿 */
  .update-info .dtag{font-size:10.5px;font-weight:700;color:#5f7a63;background:#eef3ee;
    padding:1px 7px;border-radius:20px;margin-left:6px;white-space:nowrap}

  /* 甯傚満琛屾儏锛圢EWS锛?*/
  .news{list-style:none;margin:8px 0 0;padding:0}
  .news li{font-size:13px;padding:9px 0;border-top:1px dashed var(--line);display:flex;gap:9px}
  .news li:first-child{border-top:none}
  .news .when{color:#fff;font-weight:700;flex:none;font-size:11px;background:var(--red);
    padding:3px 9px;border-radius:5px;align-self:flex-start;line-height:1.3;height:fit-content}
  .news .when.tag-绔炲搧{background:var(--blue)}
  .news .when.tag-鏂板搧{background:var(--red)}
  .news .when.tag-灞曚細{background:var(--amber)}
  .news .when.tag-澶存潯{background:#7a6b9b}
  .news .nb{display:block;flex:1}
  .news .meta{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
  .news .meta a{color:var(--teal);text-decoration:none;font-weight:600}
  .news .meta a:hover{text-decoration:underline}

  /* 鐢靛晢琛屾儏蹇収锛圗C锛?*/
  .ec-stat{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 6px}
  .ec-stat .s{background:#fbfdff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:96px}
  .ec-stat .s .k{font-size:11px;color:var(--muted)}
  .ec-stat .s .v{font-size:17px;font-weight:800;color:var(--ink);font-family:tabular-nums}
  .ec-stat .s .v small{font-size:11px;color:var(--muted);font-weight:600}
  .ec-stat .s.r .v{color:var(--red)}
  .ec-stat .s.g .v{color:var(--green)}
  .ec-warn{background:var(--amber-soft,#f6efe6);border:1px solid #e3d6c2;color:#7a6237;
    border-radius:9px;padding:8px 12px;font-size:12px;line-height:1.6;margin:0 0 10px}
  .ec{list-style:none;margin:4px 0 0;padding:0}
  .ec li{font-size:12.5px;padding:9px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
  .ec li:first-child{border-top:none}
  .ec .p{flex:none;font-weight:800;color:var(--red);font-size:15px;min-width:74px;text-align:right;font-family:tabular-nums}
  .ec .p small{display:block;font-size:10px;color:var(--muted);font-weight:600}
  .ec .eb{flex:1}
  .ec .eb b{color:var(--ink)}
  .ec .eb .meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .ec .eb .meta a{color:var(--teal);text-decoration:none;font-weight:600}
  .ec .eb .meta a:hover{text-decoration:underline}

  /* 鎷涙爣鍔ㄦ€侊紙BID锛?*/
  .bid{list-style:none;margin:6px 0 0;padding:0}
  .bid li{font-size:12.5px;padding:9px 0;border-top:1px dashed var(--line)}
  .bid li:first-child{border-top:none}
  .bid .bt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:3px}
  .bid .bt .kw{background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:5px}
  .bid .bt .ty{background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:5px}
  .bid .bt .dt{color:var(--muted);font-size:11px;margin-left:auto;font-family:tabular-nums}
  .bid .bb{display:block;color:var(--ink);font-weight:600;line-height:1.5}
  .bid .bm{display:block;font-size:11px;color:var(--muted);margin-top:3px}
  .bid .bm a{color:var(--teal);text-decoration:none;font-weight:600}
  .bid .bm a:hover{text-decoration:underline}

  /* 鏃ュ竵璧板娍棰勪及锛團X锛?*/
  .fx-alert{background:var(--red-soft);border:1px solid #d8c0b8;border-radius:10px;padding:12px 15px;
    margin:0 0 14px;font-size:13px;color:#7a4a3e;line-height:1.7;display:none}
  .fx-alert.show{display:block}
  .fx-alert b{color:#7a4a3e}
  .fx-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 14px}
  .fx-mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .fx-mini .k{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .fx-mini .v{font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}
  .fx-mini .v small{font-size:12px;color:var(--muted);font-weight:600}
  .fx-mini .sub{font-size:11px;color:#7a4a3e;margin-top:4px;font-weight:600}
  .fx-mini.red .v{color:var(--red)}
  .fx-mini.teal .v{color:var(--teal)}
  .fx-mini.blue .v{color:var(--blue)}
  .chartbox{margin:10px 0 6px;background:#fbfdff;border:1px solid var(--line);border-radius:12px;padding:8px;height:280px;position:relative;cursor:crosshair}
  #fxchart{width:100%;height:100%;display:block}
  .fx-tooltip{position:absolute;pointer-events:none;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink);box-shadow:0 6px 24px rgba(16,24,40,.14);opacity:0;transition:opacity .12s;z-index:10;min-width:180px;backdrop-filter:blur(4px)}
  .fx-tooltip .tip-date{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .fx-tooltip .tip-row{display:flex;justify-content:space-between;gap:12px;margin:2px 0}
  .fx-tooltip .tip-row span:first-child{display:flex;align-items:center;gap:6px}
  .fx-tooltip .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
  .fx-legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:11px;color:var(--muted);margin:4px 0 8px;padding:0 12px}
  .fx-legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .fx-legend .line{width:18px;height:3px;border-radius:2px;display:inline-block;flex-shrink:0}
  .fx-legend .dash{width:18px;height:3px;border-radius:2px;display:inline-block;background-image:linear-gradient(90deg,currentColor 50%,transparent 50%);background-size:8px 3px;flex-shrink:0}
  .fx-note{font-size:12px;color:var(--muted);margin:4px 0 12px}
  .events{list-style:none;margin:0;padding:0}
  .events li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .events li:first-child{border-top:none}
  .events .date{font-weight:700;color:var(--teal);flex:none;width:84px;font-size:12px}
  .events .ev b{color:var(--ink)}
  .events .ev span{color:var(--muted)}

  .fx-scn{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px;table-layout:fixed}
  .fx-scn th,.fx-scn td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:top}
  .fx-scn th{background:var(--teal);color:#fff;font-weight:600}
  .fx-scn th:nth-child(1),.fx-scn td:nth-child(1){width:100px}
  .fx-scn th:nth-child(2),.fx-scn td:nth-child(2){width:76px}
  .fx-scn th:nth-child(3),.fx-scn td:nth-child(3){width:76px}
  .fx-scn th:nth-child(4),.fx-scn td:nth-child(4){width:100px}
  .fx-scn th:nth-child(5),.fx-scn td:nth-child(5){width:60px}
  .fx-scn th:nth-child(6),.fx-scn td:nth-child(6){width:auto}
  .fx-scn td.l{text-align:left;line-height:1.55;word-break:break-word;word-wrap:break-word}
  .fx-scn .base{background:#eef6ff}
  .fx-scn .up{background:#e8efe0}
  .fx-scn .down{background:var(--red-soft)}
  .fx-buy{background:var(--green-soft);border:1px solid #b8c9a7;border-radius:12px;padding:13px 15px;font-size:13px;color:#3e5e3a;line-height:1.75;margin-top:6px}
  .fx-buy b{color:#2d4825}
  .fx-hist{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
  .fx-hist th,.fx-hist td{border:1px solid var(--line);padding:6px 9px;text-align:center}
  .fx-hist th{background:var(--teal);color:#fff}
  .fx-hist tr:nth-child(even){background:#f7fafc}
  .fx-hist .real{background:var(--red-soft);font-weight:700;color:#7a4a3e}

  footer{font-size:11.5px;color:var(--muted);padding:14px 2px 12px;line-height:1.7}
  footer b{color:var(--ink)}
  .disclaimer{background:var(--red-soft);border:1px solid #d8c0b8;color:#7a4a3e;
    padding:10px 14px;border-radius:10px;font-size:12.5px;margin:14px 0 14px}

  /* ===== 鍛ㄦ姤 / 闆疯揪锛氶€氱敤琛ㄦ牸涓庣増寮?===== */
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
  .tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.6}
  .tbl th{background:#f3f6f2;color:#3e5e3a;font-weight:700;white-space:nowrap}
  .tbl tr:nth-child(even) td{background:#fbfcfb}
  .tbl td.c,.tbl th.c{text-align:center}
  .tbl .num{font-family:tabular-nums;font-weight:800}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sec-h{font-size:13px;font-weight:800;color:#3e5e3a;margin:16px 0 7px;display:flex;align-items:center;gap:7px}
  .sec-h::before{content:"";width:3px;height:13px;background:var(--green);border-radius:2px;flex:none}
  .sec-h:first-child{margin-top:4px}
  .acts{list-style:none;margin:4px 0 0;padding:0}
  .acts li{font-size:13px;padding:8px 0 8px 22px;border-top:1px dashed var(--line);
    position:relative;color:#374151;line-height:1.7}
  .acts li:first-child{border-top:none}
  .acts li::before{content:"\25B8";position:absolute;left:6px;color:var(--green);font-weight:800}
  .mini.amber .v{color:var(--amber)}

  /* 鍛ㄦ姤锛歍L;DR */
  .rp-tldr{list-style:none;margin:14px 0 0;padding:0}
  .rp-tldr li{font-size:13px;padding:9px 13px;border-left:3px solid var(--red);background:#fdfaf9;
    border-radius:0 8px 8px 0;margin-bottom:8px;color:#374151;line-height:1.7}
  .rp-tldr li b{color:var(--ink);font-weight:800}

  /* 闆疯揪锛氳瘎鍒嗗窘绔?*/
  .scr{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--red);
    padding:1px 8px;border-radius:20px;font-family:tabular-nums;line-height:1.5}
  .scr.hi{background:#b23a2e}
  .scr.mid{background:var(--amber)}
  .scr.lo{background:#a3a9b3}
  .rd-must{border-left:3px solid var(--red);background:#fdfaf9;border-radius:0 10px 10px 0;
    padding:11px 14px;margin-bottom:10px}
  .rd-must h4{margin:0 0 7px;font-size:13.5px;color:var(--ink);line-height:1.5}
  .rd-must .row{font-size:12.5px;color:#374151;line-height:1.72;margin:3px 0}
  .rd-must .row i{font-style:normal;font-weight:800;color:#5f7a63;margin-right:5px}
  .tr-up{color:var(--red);font-weight:800}
  .tr-fl{color:var(--amber);font-weight:800}
  .tr-dn{color:#6b7280;font-weight:800}
  .rd-block{margin-bottom:12px}
  .rd-block h5{margin:0 0 5px;font-size:12.5px;font-weight:800;color:#3e5e3a}
  .rd-block ul{margin:0;padding-left:19px}
  .rd-block li{font-size:12.5px;color:#374151;line-height:1.7;margin:3px 0}
  /* 鍝嶅簲寮?*/
  @media(max-width:860px){
    .app{flex-direction:column;height:auto}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .sidebar .brand{padding:14px}
    nav{display:flex;overflow-x:auto;gap:6px;padding:6px 12px}
    nav a{margin-bottom:0;white-space:nowrap;flex-shrink:0}
    .side-footer{display:none}
    .main{padding:16px}
    .strip{grid-template-columns:repeat(2,1fr)}
    .fx-strip{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ===== 宸︿晶瀵艰埅鏍忥紙鑾叞杩?+ 寰俊寮忕豢鑹茬珫鏉★級 ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">涓?/div>
      <div>
        <h1>Ailis 涓変欢濂?/h1>
        <div class="sub">涓変赴浠ｇ悊鍟嗗姟鍙?路 璺ㄨ澶囦簯鍚屾</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#" class="active" data-nav="dashboard"><span class="icon">馃彔</span><span class="label">宸ヤ綔鍙?/span></a>
      <a href="#" data-nav="industries"><span class="icon">馃搱</span><span class="label">涓変赴琛屼笟澧為噺</span></a>
      <a href="#" data-nav="news"><span class="icon">馃摪</span><span class="label">涓変赴甯傚満琛屾儏</span></a>
      <a href="#" data-nav="fx"><span class="icon">馃挻</span><span class="label">鏃ュ竵璧板娍棰勪及</span><span class="badge" id="fx-badge" style="display:none">!</span></a>
      <a href="#" data-nav="weekly"><span class="icon">馃搵</span><span class="label">琛屼笟鍛ㄥ害鎶ュ憡</span></a>
      <a href="#" data-nav="radar"><span class="icon">馃幆</span><span class="label">甯傚満鏈轰細闆疯揪</span></a>

function latestDateIn(strs){
  let best=null;
  (strs||[]).forEach(function(s){

    while((m=re.exec(String(s||'')))){

  const chartEl = document.getElementById('fxchart');
  if (window.echarts) {
    if (!window._fxChart) window._fxChart = echarts.init(chartEl);
    const chart = window._fxChart;
    const allDates = D.allDates;
    const ctx = {
      // 璧风偣涓婁竴娈靛巻鍙?= 鏈€鍚庝竴涓偣琛ュ埌 base/bull/bear 鐨勮捣鐐癸紝淇濊瘉鏇茬嚎杩炶疮
      history: D.historyVals.map((v, i) => [allDates[i], v]),
      base: D.base.map((v, i) => [allDates[i + D.historyVals.length - 1], v]),
      bull: D.bull.map((v, i) => [allDates[i + D.historyVals.length - 1], v]),
      bear: D.bear.map((v, i) => [allDates[i + D.historyVals.length - 1], v]),
    };
    const splitIdx = D.historyVals.length - 1;   // 鍘嗗彶涓庨娴嬬殑鍒嗙晫
    chart.setOption({
      animation: false,
      grid: { left: 56, right: 24, top: 36, bottom: 64 },
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'cross', lineStyle: { color: '#888', opacity: 0.4 } },
        backgroundColor: 'rgba(255,255,255,0.97)',
        borderColor: '#dde2ea',
        borderWidth: 1,
        textStyle: { color: '#1f2a37', fontSize: 12 },
        formatter: (params) => {
          if (!params || !params.length) return '';
          const date = params[0].axisValue;
          let html = `<div style="font-size:11px;color:#6b7280;margin-bottom:6px;font-weight:600">${date}</div>`;
          params.forEach(p => {
            const color = p.color;
            const dash = p.seriesName.includes('鎮?) ? 'dashed' : (p.seriesName.includes('涔愯') ? 'dashed' : 'solid');
            const width = p.seriesName.includes('鍘嗗彶') ? '2.5' : '1.8';
            html += `<div style="display:flex;justify-content:space-between;gap:14px;margin:2px 0;align-items:center">
              <span style="display:flex;align-items:center;gap:6px">
                <span style="display:inline-block;width:18px;height:${width}px;background:${color};border-radius:2px"></span>
                <span>${p.seriesName}</span>
              </span>
              <b style="font-family:tabular-nums">${(p.value[1]).toFixed(4)}</b>
            </div>`;
          });
          return html;
        }
      },
      legend: {
        bottom: 8,
        icon: 'roundRect',
        itemWidth: 18,
        itemHeight: 3,
        itemGap: 18,
        textStyle: { color: '#4b5563', fontSize: 11 }
      },
      xAxis: {
        type: 'category',
        data: allDates,
        boundaryGap: false,
        axisLabel: {
          color: '#4b5563',
          fontSize: 11,
          rotate: 30,
          formatter: (val) => { const [_, m, d] = val.split('-'); return m + '/' + d; },
          interval: (idx, val) => {
            // 8 涓潎鍖€鍒嗗竷鏍囩
            const n = allDates.length;
            const target = [0, 6, 12, 18, 30, 42, 54, n-1];
            return target.includes(idx);
          }
        },
        axisLine: { lineStyle: { color: '#dde2ea' } },
        axisTick: { show: false },
        splitLine: { show: false }
      },
      yAxis: {
        type: 'value',
        scale: true,
        name: '100鏃ュ厓鍏戜汉姘戝竵',
        nameLocation: 'end',
        nameGap: 8,
        nameTextStyle: { color: '#5a738b', fontSize: 11, fontWeight: 600 },
        axisLabel: { color: '#4b5563', fontSize: 11, formatter: (v) => v.toFixed(1) },
        axisLine: { show: false },
        axisTick: { show: false },
        splitLine: { lineStyle: { color: '#eef2f6', type: 'dashed' } }
      },
      dataZoom: [
        { type: 'inside', xAxisIndex: 0, start: 0, end: 100 },
        { type: 'slider', xAxisIndex: 0, height: 14, bottom: 32, start: 0, end: 100,
          borderColor: '#dde2ea', fillerColor: 'rgba(122,155,107,0.15)',
          handleStyle: { color: '#7a9b6b' }, moveHandleStyle: { color: '#7a9b6b' },
          textStyle: { color: '#6b7280', fontSize: 10 } }
      ],
      series: [
        { name: '鍘嗗彶鏈堝害鍧囧€?, type: 'line', data: ctx.history, symbolSize: 5,
          itemStyle: { color: '#5a738b' }, lineStyle: { width: 2.4, color: '#5a738b' },
          smooth: false },
        { name: '鍩哄噯鎯呮櫙', type: 'line', data: ctx.base, symbolSize: 4,
          itemStyle: { color: '#c66b5f' }, lineStyle: { width: 1.8, color: '#c66b5f', type: 'dashed' } },
        { name: '涔愯(鏃ュ厓缁己)', type: 'line', data: ctx.bull, symbolSize: 4,
          itemStyle: { color: '#7a9b6b' }, lineStyle: { width: 1.8, color: '#7a9b6b', type: 'dashed' } },
        { name: '鎮茶(鏃ュ厓鍥炲急)', type: 'line', data: ctx.bear, symbolSize: 4,
          itemStyle: { color: '#a55a4e' }, lineStyle: { width: 1.8, color: '#a55a4e', type: 'dashed' } },
        { name: '鍘嗗彶/棰勬祴鍒嗙晫', type: 'line', data: ctx.history, markLine: {
          silent: true, symbol: 'none', label: { show: false },
          lineStyle: { color: '#7a9b6b', type: 'dashed', width: 1 },
          data: [{ xAxis: splitIdx }, { yAxis: 0 }]
        }, lineStyle: { width: 0, color: 'transparent' }, tooltip: { show: false } }
      ]
    });
    chart.resize();
  } else {
    // CDN 鍔犺浇澶辫触鏃?fallback锛氭樉绀烘彁绀?
    chartEl.innerHTML = '<div style="padding:40px 20px;color:#888;text-align:center">鍥捐〃鍔犺浇澶辫触锛圗Charts CDN 涓嶅彲杈撅級锛岃妫€鏌ョ綉缁滃悗鍒锋柊</div>';
  }

  document.getElementById('fx-scn').innerHTML=
    '<table class="fx-scn"><tr><th>鎯呮櫙</th><th>USD/JPY</th><th>USD/CNY</th><th>100鏃ュ厓</th><th>姒傜巼</th><th>鍚箟</th></tr>'+
    D.scenario.map(s=>'<tr class="'+s.cls+'"><td><b>'+s.name+'</b></td><td>'+s.usdjpy+'</td><td>'+s.usdcny+'</td><td><b>'+s.jpy100+'</b></td><td>'+s.prob+'</td><td class="l">'+s.desc+'</td></tr>').join('')+'</table>';
  document.getElementById('fx-buy').innerHTML=D.buyHint;
  document.getElementById('fx-news').innerHTML=D.news.map(n=>
    `<li><span class="when tag-澶存潯">${n.tag}</span><span class="nb"><b>${n.t}</b>${n.d}</span></li>`).join('');
  document.getElementById('fx-hist').innerHTML=
    '<table class="fx-hist"><tr><th>鏈堜唤</th><th>100鏃ュ厓(鏈堝害鍧囧€?</th><th>鐜瘮%</th></tr>'+
    D.history.map(h=>'<tr class="'+(h.real?'real':'')+'"><td>'+h.m+'</td><td>'+h.v+'</td><td>'+h.p+'</td></tr>').join('')+'</table>';
  document.getElementById('fx-events').innerHTML=D.events.map(e=>
    '<li><span class="date">'+e.date+'</span><span class="ev"><b>'+e.t+'</b><br><span>'+e.d+'</span></span></li>').join('');
}
renderFx();

/* ===== 姹囨€绘潯鏇存柊 ===== */
document.getElementById('sum-fx').innerHTML=FX_DATA.latest+' <small>CNY</small>';
document.getElementById('sum-update').textContent=dataStamp(FX_DATA.updated);
</script>
