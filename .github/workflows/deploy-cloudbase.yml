name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI
        run: tcb login --apiKeyId ${{ secrets.TC_SECRET_ID }} --apiKey ${{ secrets.TC_SECRET_KEY }}

      - name: Deploy to CloudBase Static Hosting
        run: tcb hosting deploy . -e ${{ secrets.TCB_ENV_ID }}

      - name: Deploy success
        if: success()
        run: echo "✅ 部署成功！已发布到 CloudBase 静态托管"
